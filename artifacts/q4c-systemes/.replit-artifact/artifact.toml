kind = "web"
previewPath = "/"
title = "Q4C Systèmes"
description = "Landing page en français de Q4C Systèmes, éditeur marocain de logiciels de comptabilité, d'audit et de finance, présentant Lexpia-Pro, HisabPro et Mizane aux cabinets et entreprises."
version = "1.0.0"
id = "artifacts/q4c-systemes"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20239

[services.development]
run = "pnpm --filter @workspace/q4c-systemes run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/q4c-systemes", "run", "build" ]
serve = "static"
publicDir = "artifacts/q4c-systemes/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20239"
BASE_PATH = "/"
